<!DOCTYPE html><html lang="hi"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Saheli AI Surveys</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#1F497D;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:20px;padding:32px 24px;max-width:400px;width:100%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.logo{font-size:24px;font-weight:900;color:#1F497D;margin-bottom:4px}.logo span{color:#FFAB00}
.sub{font-size:13px;color:#6B7280;margin-bottom:24px}
.section{margin-bottom:20px;text-align:left}
.section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#9CA3AF;margin-bottom:8px}
.link-btn{display:block;padding:12px 16px;border-radius:10px;text-decoration:none;font-size:14px;font-weight:700;margin-bottom:8px;transition:.15s}
.blue{background:#EFF6FF;color:#1F497D;border:2px solid #BFDBFE}
.blue:hover{background:#DBEAFE}
.green{background:#F0FDF4;color:#166534;border:2px solid #BBF7D0}
.green:hover{background:#DCFCE7}
.divider{height:1px;background:#F3F4F6;margin:16px 0}
</style>
</head><body>
<div class="card">
  <div class="logo">🌸 <span>Saheli</span> AI</div>
  <div class="sub">Select your survey and preferred language</div>
  <div class="section">
    <div class="section-title">📋 Pre-Survey (Baseline — Start of Pilot)</div>
    <a class="link-btn blue" href="pre-hi.html">🇮🇳 Pre-Survey — हिंदी</a>
    <a class="link-btn blue" href="pre-en.html">🇬🇧 Pre-Survey — English</a>
  </div>
  <div class="divider"></div>
  <div class="section">
    <div class="section-title">🏆 Post-Survey (Impact — Week 8)</div>
    <a class="link-btn green" href="post-hi.html">🇮🇳 Post-Survey — हिंदी</a>
    <a class="link-btn green" href="post-en.html">🇬🇧 Post-Survey — English</a>
  </div>
</div>
</body></html>
