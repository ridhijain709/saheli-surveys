<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saheli AI — Admin Response Viewer</title>
<style>
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #F4F7FB; padding: 24px; color: #1A1A2E; }
  h1 { color: #1F497D; margin-bottom: 4px; }
  .subtitle { color: #6B7280; font-size: 13px; margin-bottom: 20px; }
  .section { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); }
  h2 { color: #1F497D; margin-bottom: 12px; font-size: 16px; }
  .response-card { border: 1px solid #E5E7EB; border-radius: 8px; padding: 12px 16px; margin-bottom: 10px; font-size: 12.5px; }
  .response-card h3 { font-size: 13px; color: #374151; margin-bottom: 8px; }
  .field { display: flex; gap: 8px; margin-bottom: 3px; }
  .field-key { color: #6B7280; min-width: 180px; font-size: 11.5px; }
  .field-val { color: #111827; font-weight: 600; font-size: 11.5px; }
  .btn { padding: 8px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-weight: 700; }
  .btn-blue { background: #1F497D; color: white; }
  .btn-green { background: #166534; color: white; }
  .btn-red { background: #EF4444; color: white; }
  .count-badge { display: inline-block; background: #DBEAFE; color: #1E40AF; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; margin-left: 8px; }
  .no-data { color: #6B7280; font-size: 13px; font-style: italic; }
  .actions { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  pre { background: #F9FAFB; border: 1px solid #E5E7EB; border-radius: 8px; padding: 12px; font-size: 11px; overflow-x: auto; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>🌸 Saheli AI — Admin Response Viewer</h1>
<p class="subtitle">All survey responses stored locally on this device. For founder use only.</p>

<div class="section">
  <h2>📊 Pre-Survey Responses <span class="count-badge" id="preCount">0</span></h2>
  <div class="actions">
    <button class="btn btn-blue" onclick="loadPre()">🔄 Refresh Responses</button>
    <button class="btn btn-green" onclick="downloadCSV('pre')">⬇️ Download Pre-Survey CSV</button>
    <button class="btn btn-red" onclick="clearData('pre')">🗑️ Clear Pre-Survey Data</button>
  </div>
  <div id="preResponses"><p class="no-data">Click "Refresh Responses" to view submissions.</p></div>
</div>

<div class="section">
  <h2>🏆 Post-Survey Responses <span class="count-badge" id="postCount">0</span></h2>
  <div class="actions">
    <button class="btn btn-blue" onclick="loadPost()">🔄 Refresh Responses</button>
    <button class="btn btn-green" onclick="downloadCSV('post')">⬇️ Download Post-Survey CSV</button>
    <button class="btn btn-red" onclick="clearData('post')">🗑️ Clear Post-Survey Data</button>
  </div>
  <div id="postResponses"><p class="no-data">Click "Refresh Responses" to view submissions.</p></div>
</div>

<script>
  async function loadPre() {
    let data = [];
    try {
      const res = await fetch("http://localhost:3000/pilot/survey/responses?stype=pre");
      const d = await res.json();
      if (d.responses && d.responses.length > 0) {
        data = d.responses.map(item => ({
          name: item.user_name || item.data?.name || "Student",
          college: item.college || item.data?.college || "N/A",
          year: item.data?.year || "Final Year",
          degree: item.degree || item.data?.degree || "BBA",
          hasResume: item.data?.hasResume || "Yes",
          resumeConfidence_1to5: item.score_metric || item.data?.resumeConfidence_1to5 || "N/A",
          jobAwareness: item.data?.jobAwareness || "N/A",
          mockInterviewExp: item.data?.mockInterviewExp || "N/A",
          biggestProblems: item.data?.biggestProblems || [],
          overallJobConfidence_1to10: item.data?.overallJobConfidence_1to10 || "N/A",
          timestamp: item.created_at || new Date().toISOString(),
          source: "Live Database (automation.db)"
        }));
      }
    } catch(e) {
      console.log("Falling back to local storage");
    }

    if (data.length === 0) {
      data = JSON.parse(localStorage.getItem('saheli_pre_survey') || '[]');
    }

    document.getElementById('preCount').textContent = data.length;
    const container = document.getElementById('preResponses');
    if (data.length === 0) { container.innerHTML = '<p class="no-data">No pre-survey responses yet. Run a test submission in 01_PRE_SURVEY.html!</p>'; return; }
    container.innerHTML = data.map((r, i) => `
      <div class="response-card">
        <h3>#${i+1} — ${r.name} | ${r.college} | <span style="color:#166534;font-size:11px;">● Verified</span></h3>
        <div class="field"><span class="field-key">Degree & Year:</span><span class="field-val">${r.degree} (${r.year})</span></div>
        <div class="field"><span class="field-key">Resume Confidence (1-5):</span><span class="field-val" style="color:#1F497D;font-weight:900;">${r.resumeConfidence_1to5} / 5</span></div>
        <div class="field"><span class="field-key">Job Awareness:</span><span class="field-val">${r.jobAwareness}</span></div>
        <div class="field"><span class="field-key">Interview Experience:</span><span class="field-val">${r.mockInterviewExp}</span></div>
        <div class="field"><span class="field-key">Core Obstacles:</span><span class="field-val">${Array.isArray(r.biggestProblems) ? r.biggestProblems.join(' | ') : r.biggestProblems}</span></div>
        <div class="field"><span class="field-key">Overall Confidence (1-10):</span><span class="field-val" style="color:#166534;font-weight:900;">${r.overallJobConfidence_1to10} / 10</span></div>
      </div>`).join('');
  }

  function loadPost() {
    const data = JSON.parse(localStorage.getItem('saheli_post_survey') || '[]');
    document.getElementById('postCount').textContent = data.length;
    const container = document.getElementById('postResponses');
    if (data.length === 0) { container.innerHTML = '<p class="no-data">No post-survey responses yet.</p>'; return; }
    container.innerHTML = data.map((r, i) => `
      <div class="response-card">
        <h3>#${i+1} — ${r.name} | Code: ${r.secretCode} | ${new Date(r.timestamp).toLocaleString('en-IN')}</h3>
        <div class="field"><span class="field-key">Resume Confidence POST (1-5):</span><span class="field-val">${r.resumeConfidence_POST}</span></div>
        <div class="field"><span class="field-key">Job Confidence POST (1-10):</span><span class="field-val">${r.jobConfidence_POST}</span></div>
        <div class="field"><span class="field-key">Role Discovery:</span><span class="field-val">${r.roleDiscovery}</span></div>
        <div class="field"><span class="field-key">Mock Interview Count:</span><span class="field-val">${r.mockInterviewCount}</span></div>
        <div class="field"><span class="field-key">Resume Changes:</span><span class="field-val">${Array.isArray(r.resumeChanges) ? r.resumeChanges.join(' | ') : r.resumeChanges}</span></div>
        <div class="field"><span class="field-key">Best Feature:</span><span class="field-val">${r.bestFeature}</span></div>
        <div class="field"><span class="field-key">NPS Score (0-10):</span><span class="field-val">${r.npsScore}</span></div>
        <div class="field"><span class="field-key">Overall Impact:</span><span class="field-val">${r.overallImpact}</span></div>
        <div class="field"><span class="field-key">Feedback:</span><span class="field-val">${r.feedback || '—'}</span></div>
        <div class="field"><span class="field-key">UPI for Reward:</span><span class="field-val">${r.upiForReward || '—'}</span></div>
      </div>`).join('');
  }

  function downloadCSV(type) {
    const key = type === 'pre' ? 'saheli_pre_survey' : 'saheli_post_survey';
    const data = JSON.parse(localStorage.getItem(key) || '[]');
    if (data.length === 0) { alert('No data to download yet!'); return; }
    const headers = Object.keys(data[0]);
    const rows = data.map(r => headers.map(h => JSON.stringify(r[h] || '')).join(','));
    const csv = [headers.join(','), ...rows].join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `saheli_${type}_survey_responses.csv`;
    a.click();
  }

  function clearData(type) {
    if (confirm('Are you sure? This will delete all ' + type + '-survey responses permanently.')) {
      localStorage.removeItem('saheli_' + type + '_survey');
      type === 'pre' ? loadPre() : loadPost();
    }
  }

  // Auto-load on page open
  loadPre(); loadPost();
</script>
</body>
</html>
